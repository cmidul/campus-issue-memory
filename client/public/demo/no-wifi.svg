<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="Illustration of a laptop with a crossed-out Wi-Fi symbol">
  <rect width="400" height="300" fill="#e8ebf2"/>
  <rect x="0" y="236" width="400" height="64" fill="#d7dce8"/>
  <!-- laptop -->
  <rect x="130" y="120" width="140" height="90" rx="8" fill="#8b93a5"/>
  <rect x="142" y="132" width="116" height="66" rx="4" fill="#3c4256"/>
  <rect x="112" y="212" width="176" height="12" rx="6" fill="#6f7890"/>
  <!-- wifi arcs -->
  <g stroke="#c22f2f" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M164 176a52 52 0 0 1 72 0"/>
    <path d="M180 192a30 30 0 0 1 40 0"/>
  </g>
  <circle cx="200" cy="206" r="7" fill="#c22f2f"/>
  <!-- cross-out -->
  <path d="M148 112 252 216" stroke="#c22f2f" stroke-width="10" stroke-linecap="round"/>
  <text x="200" y="276" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#6b7280">Synthetic demo image</text>
</svg>
